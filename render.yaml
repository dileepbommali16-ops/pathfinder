services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI + AI Agent + ML Engine + Data Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: pathfinder-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: BACKEND_URL
        value: https://pathfinder-backend-klrp.onrender.com
      - key: BACKEND_PUBLIC_URL
        value: https://pathfinder-backend-klrp.onrender.com
      - key: FRONTEND_URL
        value: https://pathfinder-client-fzom.vercel.app
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: onwK4e9ZLuTAKqWW03F9
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: VOICE_MAX_SESSION_MINUTES
        value: "15"
      - key: JWT_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # Optional: Frontend Static Site (Vite / React 19 Client on Render)
  # ----------------------------------------------------------------------------
  - type: static
    name: pathfinder-frontend
    autoDeploy: true
    buildCommand: npm install --legacy-peer-deps && npm run build:client
    staticPublishPath: dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE_URL
        value: https://pathfinder-backend-klrp.onrender.com
      - key: VITE_API_URL
        value: https://pathfinder-backend-klrp.onrender.com
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: VITE_GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: VITE_ELEVENLABS_VOICE_ID
        value: onwK4e9ZLuTAKqWW03F9
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_VOYAGE_API_KEY
        sync: false
      - key: VITE_ELEVENLABS_API_KEY
        sync: false
