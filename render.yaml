services:
  - type: web
    name: pathfinder-backend-klrp
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT --ws auto --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-native-audio-latest
      - key: GEMINI_VOICE_NAME
        value: Puck
      - key: BACKEND_URL
        value: https://pathfinder-backend-klrp.onrender.com
      - key: BACKEND_PUBLIC_URL
        value: https://pathfinder-backend-klrp.onrender.com
      - key: FRONTEND_URL
        value: https://pathfinder-client-fzom.vercel.app
      - key: OWNER_EMAIL
        value: dileepbommali16@gmail.com
      - key: N8N_WEBHOOK_URL
        value: https://dileepdas.app.n8n.cloud/webhook/pathfinder-google-sync
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
