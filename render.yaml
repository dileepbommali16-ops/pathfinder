services:
  - type: web
    name: pathfinder-backend-klrp
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT --ws websockets --ws-ping-interval 20 --ws-ping-timeout 20 --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.0-flash-exp
      - key: GEMINI_VOICE_NAME
        value: Puck
      - key: FRONTEND_URL
        value: https://pathfinder-client-fzom.vercel.app
      - key: N8N_WEBHOOK_URL
        value: https://dileepdas.app.n8n.cloud/webhook/pathfinder-google-sync
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
