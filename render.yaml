services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI + AI Agent + ML Engine + Data Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: pathfinder-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-2-latest
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: onwK4e9ZLuTAKqWW03F9
      - key: COGNEE_ENABLED
        sync: false
      - key: GEMINI_LIVE_MODEL
        sync: false
      - key: GEMINI_TEXT_MODEL
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: VOICE_MAX_SESSION_MINUTES
        value: "15"
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://pathfinder-client-fzom.vercel.app,http://localhost:3000,http://localhost:5173
      - key: BACKEND_PUBLIC_URL
        value: https://pathfinder-backend-klrp.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # Optional: Frontend Static Site (Vite / React 19 Client on Render)
  # ----------------------------------------------------------------------------
  - type: static
    name: pathfinder-frontend
    autoDeploy: false
    buildCommand: npm install --legacy-peer-deps && npm run build:client
    staticPublishPath: dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE_URL
        value: https://pathfinder-backend-klrp.onrender.com
