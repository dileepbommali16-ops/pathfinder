<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathfinder 2.0 - Interactive Video Demo & Slide Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --cyan: #00E5FF;
      --purple: #A855F7;
      --amber: #FFD600;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-badge {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--amber), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #000;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }
    .title h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(to right, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .title p {
      font-size: 13px;
      color: var(--muted);
    }
    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 12px;
      font-weight: 700;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }
    .player-window {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 229, 255, 0.15);
      display: flex;
      flex-direction: column;
    }
    .screen-view {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .narration-overlay {
      position: absolute;
      bottom: 24px;
      left: 24px;
      right: 24px;
      background: rgba(7, 10, 18, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .narration-text h3 {
      font-size: 14px;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .narration-text p {
      font-size: 15px;
      color: #fff;
      font-weight: 600;
      line-height: 1.4;
    }
    .scene-badge {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--amber);
      white-space: nowrap;
    }
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(10, 14, 24, 0.95);
      border-top: 1px solid var(--border);
      gap: 16px;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--cyan);
      transform: translateY(-1px);
    }
    button.primary {
      background: linear-gradient(135deg, var(--cyan), #0091ff);
      color: #000;
      border: none;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
    }
    button.primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
    }
    .progress-track {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--amber), var(--cyan));
      border-radius: 999px;
      width: 10%;
      transition: width 0.3s ease;
    }
    .thumbnails-strip {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      width: 100%;
    }
    .thumb-btn {
      padding: 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      cursor: pointer;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.2s;
    }
    .thumb-btn.active {
      border-color: var(--cyan);
      color: #fff;
      background: rgba(0, 229, 255, 0.15);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-group">
        <div class="logo-badge">P2</div>
        <div class="title">
          <h1>Pathfinder 2.0 • Live Video Walkthrough</h1>
          <p>Autonomous Placement Analytics & AI Career Guidance Platform</p>
        </div>
      </div>
      <div class="live-tag">
        <div class="pulse-dot"></div>
        <span>Production Verified</span>
      </div>
    </div>

    <!-- Video Showcase Window -->
    <div class="player-window">
      <div class="screen-view">
        <img id="mainScreen" class="screen-img" src="../client/public/pathfinder_logo.jpg" alt="Pathfinder Screen">
        
        <div class="narration-overlay">
          <div class="narration-text">
            <h3 id="sceneLabel">Scene 1 / 10 • Opening & Identity</h3>
            <p id="narrationText">Pathfinder 2.0: AI-Powered Career Co-Pilot that turns placement anxiety into predictable offers.</p>
          </div>
          <div class="scene-badge" id="timeBadge">0:00 / 1:00</div>
        </div>
      </div>

      <div class="controls-bar">
        <div class="btn-group">
          <button id="playBtn" class="primary" onclick="togglePlay()">▶ Play Demo</button>
          <button onclick="prevScene()">❮ Prev</button>
          <button onclick="nextScene()">Next ❯</button>
        </div>

        <div class="progress-track" onclick="seek(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <a href="https://pathfinder-client-fzom.vercel.app" target="_blank" style="text-decoration: none;">
          <button style="border-color: var(--amber); color: var(--amber);">🚀 Open Live Web App</button>
        </a>
      </div>
    </div>

    <!-- Thumbnails navigation -->
    <div class="thumbnails-strip" id="thumbsStrip"></div>
  </div>

  <script>
    const scenes = [
      {
        img: "../client/public/pathfinder_logo.jpg",
        title: "SCENE 1: BRAND IDENTITY & VISION",
        text: "Pathfinder 2.0 unites historical campus hiring benchmarks with bilingual AI coaching to guide engineering students.",
        time: "0:00"
      },
      {
        img: "screenshots/01_lamp_login_untouched.png",
        title: "SCENE 2: INTERACTIVE LAMP LOGIN",
        text: "Pull the interactive desk lamp string to illuminate the room. Zero-blockage access with instant 1-click Guest Mode.",
        time: "0:06"
      },
      {
        img: "screenshots/02_screen_dashboard_overview.png",
        title: "SCENE 3: READINESS INTELLIGENCE COMMAND CENTER",
        text: "Calibrated Random Forest model trained on 972 student records evaluates 5 readiness vectors with salary tier projections.",
        time: "0:12"
      },
      {
        img: "screenshots/03_screen_roadmap.png",
        title: "SCENE 4: 6-WEEK STEP-WISE MILESTONE SPRINT",
        text: "Automated skill gap engine converts raw academic weaknesses into semester-by-semester tactical study sprints.",
        time: "0:18"
      },
      {
        img: "screenshots/04_screen_ai_coach.png",
        title: "SCENE 5: BILINGUAL SCREEN-AWARE AI COACH",
        text: "Powered by Google Gemini 2.0 Flash. Understands live screen metrics and mentors candidates in English and Telugu.",
        time: "0:24"
      },
      {
        img: "screenshots/05_screen_cohort_analytics.png",
        title: "SCENE 6: INSTITUTIONAL COHORT ANALYTICS",
        text: "Interactive distributions tracking package medians, CGPA cutoffs, and tier-1 recruitment trends across 9 branches.",
        time: "0:30"
      },
      {
        img: "screenshots/06_screen_projects.png",
        title: "SCENE 7: 23 PRODUCTION ARCHITECTURE BLUEPRINTS",
        text: "Curated software, IoT, and SIH hardware project guides with system pipelines, build phases, and viva defense answers.",
        time: "0:36"
      },
      {
        img: "screenshots/07_screen_resume_studio.png",
        title: "SCENE 8: RESUME STUDIO & ATS SCORER",
        text: "Instant ATS compliance audit, formatting diagnostics, and automated bullet-point impact rewrites.",
        time: "0:42"
      },
      {
        img: "screenshots/09_screen_defense_simulator.png",
        title: "SCENE 9: VIVA DEFENSE & INTERVIEW SIMULATOR",
        text: "Real-time technical interviewer grilling tests system design depth, failure scenarios, and architectural choices.",
        time: "0:48"
      },
      {
        img: "screenshots/10_screen_profile_settings.png",
        title: "SCENE 10: ENTERPRISE SECURITY & DATA PRIVACY",
        text: "Role-based access, IDOR protection, JWT revocation, and GDPR data export hosted on Vercel and Render.",
        time: "0:54"
      }
    ];

    let currentIndex = 0;
    let isPlaying = false;
    let timer = null;

    const mainScreen = document.getElementById("mainScreen");
    const sceneLabel = document.getElementById("sceneLabel");
    const narrationText = document.getElementById("narrationText");
    const timeBadge = document.getElementById("timeBadge");
    const progressFill = document.getElementById("progressFill");
    const playBtn = document.getElementById("playBtn");
    const thumbsStrip = document.getElementById("thumbsStrip");

    // Init thumbs
    scenes.forEach((s, i) => {
      const b = document.createElement("div");
      b.className = `thumb-btn ${i === 0 ? 'active' : ''}`;
      b.innerText = `S${i + 1}`;
      b.onclick = () => showScene(i);
      thumbsStrip.appendChild(b);
    });

    function showScene(index) {
      currentIndex = index;
      const s = scenes[index];
      mainScreen.style.opacity = "0";
      setTimeout(() => {
        mainScreen.src = s.img;
        mainScreen.style.opacity = "1";
      }, 200);

      sceneLabel.innerText = s.title;
      narrationText.innerText = s.text;
      timeBadge.innerText = `${s.time} / 1:00`;
      progressFill.style.width = `${((index + 1) / scenes.length) * 100}%`;

      document.querySelectorAll(".thumb-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx === index);
      });
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      playBtn.innerText = isPlaying ? "⏸ Pause" : "▶ Play Demo";
      if (isPlaying) {
        timer = setInterval(() => {
          if (currentIndex < scenes.length - 1) {
            showScene(currentIndex + 1);
          } else {
            showScene(0);
          }
        }, 5000);
      } else {
        clearInterval(timer);
      }
    }

    function nextScene() {
      if (currentIndex < scenes.length - 1) showScene(currentIndex + 1);
      else showScene(0);
    }

    function prevScene() {
      if (currentIndex > 0) showScene(currentIndex - 1);
      else showScene(scenes.length - 1);
    }
  </script>
</body>
</html>
