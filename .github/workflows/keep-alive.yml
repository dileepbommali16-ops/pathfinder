name: Render Keep Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier from sleeping (timeout is 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP GET request
        run: |
          echo "Pinging Pathfinder Render Backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://pathfinder-backend-klrp.onrender.com/api/health" || echo "TIMEOUT")
          echo "Response HTTP Status: $HTTP_STATUS"
