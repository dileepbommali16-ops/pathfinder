name: Pathfinder Full-Stack CI & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-verify:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --no-tags --prune --depth=1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      - name: Install Dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run Backend Tests
        run: |
          .venv/bin/python -m unittest discover backend/tests

  client-verify:
    name: Client TypeScript & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        run: |
          git init .
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch --no-tags --prune --depth=1 origin "${{ github.sha }}"
          git checkout --force FETCH_HEAD

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Type Check (tsc --noEmit)
        run: npm run check

      - name: Run Client Vitest
        run: npm run test

      - name: Production Client Build
        run: npm run build
