name: Pathfinder CI & Security Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Production & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend 7 Pillars
        run: python scripts/verify_seven_pillars.py

      - name: Run Production Readiness Tests
        run: python scripts/test_production_readiness.py

      - name: Run Security Audit Test Suite
        run: python scripts/security_audit_test.py
